<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#070b14"
  />

  <!-- Preload the global Command Center background so it is ready with the first paint -->
  <link
    rel="preload"
    as="image"
    href="/pulseplay-command-center-bg.jpg"
    fetchpriority="high"
  />

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="/pulseplay-logo.svg"
  />

  <!-- SEO -->
  <title>PulsePlay Gaming | Gaming, Streaming &amp; Community</title>

  <meta
    name="description"
    content="PulsePlay Gaming is a gaming command center for gamers, streamers, and gaming communities. Discover games, watch streams, explore gaming news, find gaming gear, shop merchandise, and connect with the PulsePlay community."
  />

  <meta
    name="keywords"
    content="PulsePlay Gaming, PulsePlay, PulsePlay.online, gaming command center, gaming community, Twitch streams, gaming news, video games, PC gaming, console gaming, gaming gear, gaming merchandise, Veiltactician"
  />

  <link
    rel="canonical"
    href="https://pulseplay.online/"
  />

  <!-- Entity / Organization structured data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "PulsePlay Gaming",
      "alternateName": "PulsePlay",
      "url": "https://pulseplay.online/",
      "description": "PulsePlay Gaming is a gaming, streaming, and community platform built around a Gaming Command Center for players and creators.",
      "sameAs": [
        "https://www.facebook.com/PulsePlayonline/",
        "https://www.twitch.tv/veiltactician"
      ]
    }
  </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PulsePlay Gaming",
      "alternateName": "PulsePlay",
      "url": "https://pulseplay.online/",
      "description": "PulsePlay Gaming — Gaming, Streaming & Community."
    }
  </script>

  <!-- Open Graph / Facebook / Discord -->
  <meta
    property="og:site_name"
    content="PulsePlay Gaming"
  />

  <meta
    property="og:title"
    content="PulsePlay Gaming | Gaming, Streaming &amp; Community"
  />

  <meta
    property="og:description"
    content="PulsePlay Gaming is the Gaming Command Center for games, livestreams, gaming news, community, gaming gear, and merchandise."
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:url"
    content="https://pulseplay.online/"
  />

  <meta
    property="og:image"
    content="https://pulseplay.online/pulseplay-social.png"
  />

  <!-- Twitter / X -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="PulsePlay Gaming | Gaming, Streaming &amp; Community"
  />

  <meta
    name="twitter:description"
    content="The PulsePlay Gaming Command Center for gaming, streaming, community, news, gear, and merchandise."
  />

  <meta
    name="twitter:image"
    content="https://pulseplay.online/pulseplay-social.png"
  />

</head>

<body>

  <div id="root"></div>

  <script
    type="module"
    src="/src/main.tsx"
  ></script>

</body>

</html>
