name: Analytics Safety Tests

on:
  push:
    branches:
      - "test/analytics-retry-safety"
  pull_request:
    branches:
      - main
    paths:
      - "src/services/analytics.ts"
      - "src/services/analyticsRetry.js"
      - "src/services/analyticsRetry.d.ts"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/analytics-safety-tests.yml"

permissions:
  contents: read

jobs:
  test-build-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated analytics retry tests
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Run lint checks
        run: npm run lint
