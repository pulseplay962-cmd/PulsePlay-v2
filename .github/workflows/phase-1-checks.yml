name: Phase 1 frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-1-store-analytics-fixes]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run isolated analytics integration check
        run: node --test tests/analytics-integration.test.mjs
